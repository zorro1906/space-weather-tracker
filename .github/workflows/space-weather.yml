name: Space weather check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum; runs can start a few minutes late)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message with live readings"
        type: boolean
        default: true

permissions:
  contents: write   # lets the job save state.json so an alert is never repeated

concurrency:
  group: space-weather
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Check solar wind
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPEED_MIN: "500"
          BZ_MAX: "-10"
          TZ_NAME: "Europe/Prague"
          NOAA_MIN_G: "2"
        run: python3 tracker.py --state state.json ${{ inputs.test && '--test' || '' }}

      - name: Save state if it changed
        run: |
          if [ -n "$(git status --porcelain -- state.json)" ]; then
            git config user.name "space-weather-bot"
            git config user.email "space-weather-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update storm state"
            git push
          fi
